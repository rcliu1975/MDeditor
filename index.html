<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#212121" />
<meta name="description" content="Markdown Editor — ChatGPT-style live preview" />
<!-- CSP 放寬 cdn.jsdelivr.net script (MathJax) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self'; manifest-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" />
<title>MDeditor: Untitled</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- MathJax 3：先設定，再載入 -->
<script>
window.MathJax = {
  tex: {
    inlineMath:  [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    tags: 'ams'
  },
  svg: { fontCache: 'global' },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code'],
    // 允許在 sanitize 後的 DOM 中執行
    processHtmlClass: 'md'
  },
  startup: { typeset: false }   // 不自動排版；由我們手動呼叫
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#212121; --surface:#2f2f2f; --surface2:#3a3a3a; --border:#444;
  --text:#d0d0d0; --text-muted:#888; --accent:#10a37f; --accent2:#19c37d;
  --sidebar-bg:#181818; --toolbar-bg:#1a1a1a;
  --font-body:'Sora',sans-serif; --font-code:'JetBrains Mono',monospace;
  --sidebar-w:240px; --header-h:48px; --toolbar-h:38px;
  --editor-font-size:13.5px; --preview-font-size:15px; --preview-list-font-size:15px;
  --preview-code-font-size:13px; --preview-table-font-size:14px; --preview-th-font-size:12.5px;
  --shadow: 0 4px 12px rgba(0,0,0,0.1);
}

body.theme-light {
  --bg:#f9f9f9; --surface:#ffffff; --surface2:#efefef; --border:#ccc;
  --text:#1a1a1a; --text-muted:#444; --accent:#0e8a6c; --accent2:#0b8468;
  --sidebar-bg:#ffffff; --toolbar-bg:#f3f3f3;
  --shadow: 0 2px 8px rgba(0,0,0,0.05);
}

body.theme-eink {
  --bg:#ffffff; --surface:#ffffff; --surface2:#eeeeee; --border:#000;
  --text:#000000; --text-muted:#111; --accent:#000000; --accent2:#000000;
  --sidebar-bg:#ffffff; --toolbar-bg:#ffffff;
  --shadow: none;
}

body.theme-eink * { 
  transition: none !important; 
  animation: none !important; 
  box-shadow: none !important; 
  text-shadow: none !important;
}

html,body { height:100%; font-family:var(--font-body); background:var(--bg); color:var(--text); overflow:hidden; }

/* App */
#app { display:flex; height:100dvh; }

/* Sidebar */
#sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; transition:width .22s ease, background 0.2s; overflow:hidden; z-index:100; }
#sidebar.collapsed { width:0; }
.sidebar-header { height:var(--header-h); padding:0 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:9px; flex-shrink:0; }
.logo { width:26px; height:26px; background:var(--accent); border-radius:6px; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
.sidebar-title { font-size:13px; font-weight:600; white-space:nowrap; }
#file-list { flex:1; overflow-y:auto; padding:6px; }
#file-list::-webkit-scrollbar { width:3px; }
#file-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.file-item { padding:7px 10px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:7px; transition:background .13s,color .13s; white-space:nowrap; overflow:hidden; min-width:0; }
.file-item .fname { overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.file-item:hover { background:var(--surface); color:var(--text); }
.file-item.active { background:var(--surface2); color:var(--text); }
.file-item .del-btn { opacity:0; font-size:14px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:0 2px; transition:opacity .13s,color .13s; flex-shrink:0; }
.file-item:hover .del-btn { opacity:1; }
.file-item .del-btn:hover { color:#e06c75; }
.sidebar-footer { padding:10px; border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
.sb-btn { width:100%; padding:7px 10px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text-muted); font-size:12px; cursor:pointer; font-family:var(--font-body); display:flex; align-items:center; justify-content:center; gap:6px; transition:all .13s; white-space:nowrap; }
.sb-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(16,163,127,.07); }
.sb-btn.primary { background:rgba(16,163,127,.12); border-color:rgba(16,163,127,.35); color:var(--accent2); }
.sb-btn.primary:hover { background:rgba(16,163,127,.22); }
.sidebar-footer #file-input { grid-column:1 / -1; }

/* Main */
#main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* Header */
#header { height:var(--header-h); background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:8px; flex-shrink:0; }
.icon-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; width:30px; height:30px; border-radius:6px; display:grid; place-items:center; font-size:15px; transition:background .13s,color .13s; flex-shrink:0; }
.icon-btn:hover { background:var(--surface); color:var(--text); }
#doc-title-wrap { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
#doc-title { font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
#doc-title:hover { color:var(--accent2); }
.unsaved-dot { width:7px; height:7px; border-radius:50%; background:var(--accent2); flex-shrink:0; display:none; }
.unsaved-dot.show { display:block; }
.header-right { display:flex; gap:4px; align-items:center; flex-shrink:0; }
.header-action-btn {
  width:32px;
  height:32px;
  padding:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;
  color:var(--text-muted);
  cursor:pointer;
  font-size:11.5px;
  font-family:var(--font-body);
  display:inline-flex;
  align-items:center;
  gap:0;
  transition:background .13s,color .13s,border-color .13s,opacity .13s;
  white-space:nowrap;
  flex-shrink:0;
  line-height:1;
}
.header-action-btn svg {
  width:16px;
  height:16px;
  display:block;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transform: translateX(6px) translateY(-1px);
}
.header-action-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(16,163,127,.07); }
.header-action-btn:disabled { opacity:.45; cursor:not-allowed; border-color:var(--border); color:var(--text-muted); background:var(--surface); }
.header-action-btn.dirty { border-color:rgba(224,108,117,.35); color:#ffb4bb; background:rgba(224,108,117,.12); }
.reload-notice { display:none; align-items:center; gap:6px; padding:3px 8px; border-radius:999px; background:rgba(224,108,117,.14); color:#ffb4bb; border:1px solid rgba(224,108,117,.35); white-space:nowrap; }
.reload-notice.show { display:flex; }
.theme-select, .font-size-select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:11.5px; padding:3px 6px; cursor:pointer; font-family:var(--font-body); outline:none; }
.theme-select:hover { border-color:var(--accent); }
.font-size-select:hover { border-color:var(--accent); }
.badge { font-size:11px; padding:2px 7px; border-radius:999px; background:rgba(16,163,127,.12); color:var(--accent2); border:1px solid rgba(16,163,127,.22); white-space:nowrap; }
.view-tabs { display:flex; background:var(--surface); border-radius:7px; padding:2px; gap:1px; }
.view-tab { padding:3px 10px; border-radius:5px; font-size:11.5px; font-weight:500; cursor:pointer; color:var(--text-muted); transition:all .13s; background:none; border:none; font-family:var(--font-body); }
.view-tab.active { background:var(--surface2); color:var(--text); }

/* Workspace */
#workspace { flex:1; display:flex; overflow:hidden; }
#divider { width:4px; background:var(--border); cursor:col-resize; flex-shrink:0; transition:background .13s; }
#divider:hover, #divider.dragging { background:var(--accent); }

/* Editor pane */
#editor-pane { display:flex; flex-direction:column; overflow:hidden; min-width:0; width:50%; }
#toolbar { height:var(--toolbar-h); background:var(--toolbar-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 8px; gap:2px; flex-shrink:0; overflow-x:auto; transition: background 0.2s; }
#toolbar::-webkit-scrollbar { display:none; }
.tb-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; height:26px; padding:0 7px; border-radius:5px; font-size:13px; font-family:var(--font-body); display:grid; place-items:center; transition:background .13s,color .13s; white-space:nowrap; flex-shrink:0; }
.tb-btn:hover { background:var(--surface2); color:var(--text); }
.tb-sep { width:1px; height:18px; background:var(--border); margin:0 3px; flex-shrink:0; }
#editor { flex:1; resize:none; border:none; outline:none; background:var(--surface); color:var(--text); font-family:var(--font-code); font-size:var(--editor-font-size); line-height:1.7; padding:20px 24px; overflow-y:auto; tab-size:2; caret-color:var(--accent2); transition: background 0.2s, color 0.2s; }
#editor::-webkit-scrollbar { width:5px; }
#editor::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
#editor::selection { background:rgba(16,163,127,.25); }

/* Theme specific overrides */
body.theme-light #editor { background: #fff; }
body.theme-light .code-header { background: #f0f0f0; }

body.theme-eink #editor { background: #fff; border: 1px solid #000; }
body.theme-eink .code-header { background: #fff; border: 1px solid #000; }
body.theme-eink .code-block { border: 2px solid #000; }
body.theme-eink .sb-btn { border: 2px solid #000; color: #000; }
body.theme-eink .view-tabs { border: 2px solid #000; }
body.theme-eink .view-tab.active { background: #000; color: #fff; }

/* Preview pane */
#preview-pane { flex:1; overflow-y:auto; background:var(--bg); min-width:0; transition: background 0.2s; }
#preview-pane::-webkit-scrollbar { width:5px; }
#preview-pane::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
#preview { max-width:720px; margin:0 auto; padding:28px 28px 60px; }

/* Markdown styles */
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { font-weight:600; line-height:1.3; margin:1.6em 0 .5em; color:var(--text); }
.md h1 { font-size:1.85em; }
.md h2 { font-size:1.45em; border-bottom:1px solid var(--border); padding-bottom:.3em; }
.md h3 { font-size:1.18em; } .md h4 { font-size:1em; }
.md h1:first-child,.md h2:first-child { margin-top:0; }
.md p { font-size:var(--preview-font-size); line-height:1.85; margin-bottom:.9em; }
.md a { color:var(--accent2); text-decoration:none; border-bottom:1px solid rgba(25,195,125,.3); transition:border-color .13s; }
.md a:hover { border-bottom-color:var(--accent2); }
.md strong { font-weight:600; color:var(--text); }
.md em { font-style:italic; color:var(--text); opacity:0.9; }
.md ul,.md ol { padding-left:1.5em; margin-bottom:.9em; }
.md li { font-size:var(--preview-list-font-size); line-height:1.8; margin-bottom:.25em; }
.md li::marker { color:var(--accent); }
.md blockquote { border-left:3px solid var(--accent); margin:1em 0; padding:.5em 1.1em; background:rgba(16,163,127,.07); border-radius:0 6px 6px 0; color:var(--text); opacity:0.8; font-style:italic; }
.md hr { border:none; border-top:1px solid var(--border); margin:1.8em 0; }
.md img { max-width:100%; border-radius:7px; margin:.8em 0; }
.md table { width:100%; border-collapse:collapse; margin:1em 0; font-size:var(--preview-table-font-size); }
.md thead tr { background:var(--surface); }
.md th { padding:9px 13px; text-align:left; font-weight:600; font-size:var(--preview-th-font-size); color:var(--text); border-bottom:1px solid var(--border); }
.md td { padding:9px 13px; border-bottom:1px solid var(--border); }
.md tr:last-child td { border-bottom:none; }
.md tr:hover td { background:rgba(255,255,255,.025); }
.md code:not(pre code) { font-family:var(--font-code); font-size:var(--preview-code-font-size); background:var(--surface2); color:var(--accent2); padding:2px 6px; border-radius:4px; border:1px solid var(--border); }
.code-block { margin:1em 0; border-radius:9px; overflow:hidden; border:1px solid var(--border); }
.code-header { display:flex; align-items:center; justify-content:space-between; padding:7px 13px; background:#252525; border-bottom:1px solid var(--border); }
.code-lang { font-size:11px; color:var(--text-muted); font-family:var(--font-code); }
.copy-btn { font-size:11px; padding:2px 9px; background:none; border:1px solid var(--border); border-radius:4px; color:var(--text-muted); cursor:pointer; font-family:var(--font-body); transition:all .13s; }
.copy-btn:hover { background:var(--surface); color:var(--text); }
.copy-btn.copied { color:var(--accent2); border-color:var(--accent); }

/* Theme specific preview overrides */
body:not(.theme-light):not(.theme-eink) .md strong { color: #ffffff; font-weight: 600; }

body.theme-light .md strong { color: #000; font-weight: 600; }
body.theme-light .md a { color: var(--accent2); font-weight: 500; }
body.theme-light .md code:not(pre code) { background: #eee; color: #b71c1c; border-color: #ddd; font-weight: 500; }
body.theme-light .code-header { background: #e0e0e0; border-color: #ccc; }
body.theme-light .code-lang { color: #222; font-weight: 500; }
body.theme-light .copy-btn { border-color: #aaa; color: #222; font-weight: 500; }
body.theme-light .header-action-btn { background: #f7f7f7; color: #333; }
body.theme-light .header-action-btn:hover { background: rgba(14, 138, 108, 0.08); color: #0e8a6c; }
body.theme-light .header-action-btn:disabled { background: #f7f7f7; color: #777; }
body.theme-light .header-action-btn.dirty { background: rgba(176, 0, 32, 0.08); color: #a00020; border-color: rgba(176, 0, 32, 0.2); }
body.theme-light .reload-notice { background: rgba(176, 0, 32, 0.08); color: #a00020; border-color: rgba(176, 0, 32, 0.2); }
body.theme-light #drop-overlay { background: rgba(14, 138, 108, 0.08); border-color: rgba(14, 138, 108, 0.7); }
body.theme-light .drop-overlay-content { background: rgba(255,255,255,.96); border-color: rgba(14, 138, 108, 0.25); }
body.theme-light .md pre code { background: #fdfdfd !important; color: #24292e !important; }
/* Light mode hljs overrides (GitHub Light Style) */
body.theme-light .hljs-keyword, body.theme-light .hljs-selector-tag { color: #d73a49 !important; font-weight: bold; }
body.theme-light .hljs-string, body.theme-light .hljs-attr { color: #032f62 !important; }
body.theme-light .hljs-title, body.theme-light .hljs-section { color: #8a63d2 !important; font-weight: bold; }
body.theme-light .hljs-comment { color: #6a737d !important; }
body.theme-light .hljs-built_in { color: #c06500 !important; font-weight: bold; } /* print, len, etc */
body.theme-light .hljs-params, body.theme-light .hljs-variable, body.theme-light .hljs-subst { color: #4a1d00 !important; } /* (name), variable */
body.theme-light .hljs-number { color: #005cc5 !important; }

body.theme-eink .md strong { color: #000; font-weight: 800; }
body.theme-eink .md code:not(pre code) { background: #fff; color: #000; border: 1px solid #000; font-weight: bold; }
body.theme-eink .code-header { background: #fff; border-color: #000; }
body.theme-eink .code-lang { color: #000; font-weight: bold; }
body.theme-eink .copy-btn { border: 2px solid #000; color: #000; font-weight: bold; }
body.theme-eink .header-action-btn { border: 2px solid #000; color: #000; background: #fff; font-weight: bold; }
body.theme-eink .header-action-btn:hover { background: #fff; color: #000; }
body.theme-eink .header-action-btn:disabled { background: #fff; color: #666; }
body.theme-eink .header-action-btn.dirty { background: #fff; color: #000; border-color: #000; }
body.theme-eink .reload-notice { background: #fff; color: #000; border: 2px solid #000; }
body.theme-eink #drop-overlay { background: rgba(255,255,255,.92); border: 3px dashed #000; }
body.theme-eink .drop-overlay-content { background: #fff; border: 2px solid #000; color: #000; box-shadow:none; }
body.theme-eink .md pre code { background: #fff !important; color: #000 !important; }
/* E-ink hljs overrides */
body.theme-eink .hljs-keyword, body.theme-eink .hljs-string, body.theme-eink .hljs-title, 
body.theme-eink .hljs-built_in, body.theme-eink .hljs-params { color: #000 !important; font-weight: bold; text-decoration: underline; }
body.theme-eink .hljs-subst, body.theme-eink .hljs-variable, body.theme-eink .hljs-template-variable {
  color: #000 !important;
  font-weight: 900 !important;
  opacity: 1 !important;
}

.md pre { margin:0 !important; }
.md pre code { font-family:var(--font-code) !important; font-size:var(--preview-code-font-size) !important; line-height:1.65 !important; padding:15px !important; display:block; overflow-x:auto; background:transparent !important; }
.md input[type=checkbox] { accent-color:var(--accent); margin-right:6px; }

/* ── MathJax 數學式樣式覆蓋 ── */
/* 讓 SVG 數學式顏色融入深色主題 */
.md mjx-container { color: var(--text); overflow-x: auto; max-width: 100%; }
/* display math 置中並有間距 */
.md mjx-container[display="true"] {
  display: block;
  margin: 1em auto;
  text-align: center;
  overflow-x: auto;
  padding: 0.4em 0;
}
/* inline math 對齊基線 */
.md mjx-container:not([display="true"]) {
  vertical-align: middle;
}

/* Sidebar Overlay */
#sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:95; backdrop-filter:blur(2px); }
#sidebar-overlay.show { display:block; }
#drop-overlay { position:fixed; inset:18px; border:2px dashed rgba(16,163,127,.8); border-radius:18px; background:rgba(16,163,127,.12); display:none; align-items:center; justify-content:center; z-index:110; pointer-events:none; }
#drop-overlay.show { display:flex; }
.drop-overlay-content { padding:24px 28px; border-radius:16px; background:rgba(24,24,24,.92); border:1px solid rgba(16,163,127,.35); color:var(--text); text-align:center; box-shadow:var(--shadow); }
.drop-overlay-title { font-size:18px; font-weight:600; margin-bottom:6px; }
.drop-overlay-subtitle { font-size:13px; color:var(--text-muted); }

.share-modal { display:none; position:fixed; inset:0; z-index:120; }
.share-modal.show { display:block; }
.share-modal-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(2px); }
.share-modal-panel { position:relative; width:min(720px, calc(100vw - 28px)); margin:10vh auto 0; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; gap:14px; }
.share-modal-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.share-modal-title { font-size:18px; font-weight:600; color:var(--text); }
.share-modal-message { font-size:13px; line-height:1.6; color:var(--text-muted); }
.share-modal-message.error { color:#ff9ea8; }
.share-link-wrap { display:flex; flex-direction:column; gap:8px; }
.share-link-label { font-size:12px; color:var(--text-muted); }
.share-link-input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:var(--font-code); font-size:12px; }
.share-link-input:focus { outline:1px solid var(--accent); border-color:var(--accent); }
.share-modal-actions { display:flex; flex-wrap:wrap; gap:8px; }
.share-modal .sb-btn { width:auto; min-width:96px; }
.share-modal.error .share-link-wrap,
.share-modal.error .share-modal-actions { display:none; }

/* View modes */
#workspace.editor-only #preview-pane,
#workspace.editor-only #divider { display:none; }
#workspace.editor-only #editor-pane { width:100%; }
#workspace.preview-only #editor-pane,
#workspace.preview-only #divider { display:none; }
#workspace.preview-only #preview-pane { flex:1; }

/* Empty state */

<script>
const SHARED_DATA_URL = './__shared_target__';
const WORKSPACE_STATE_KEY = 'md-editor-session-v2';
const WORKSPACE_MIGRATION_KEY = 'md-editor-v1';
const FILE_WATCH_INTERVAL_MS = 4000;
const HANDLE_DB_NAME = 'md-editor-handles-v1';
const HANDLE_STORE_NAME = 'handles';

// ────────────────────────────────────────────────────────────
// 數學式保護層
// 在送給 marked 之前，先把 $$...$$、$...$、\[...\]、\(...\)
// 置換成不會被 marked 破壞的佔位符，渲染 HTML 後再還原。
// ────────────────────────────────────────────────────────────
const mathStore = [];

function escapeMath(src) {
  mathStore.length = 0;

  // 順序：先處理較長的 display math，再處理 inline math
  // 1. $$...$$  (多行)
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
    const i = mathStore.length;
    mathStore.push({ tex, display: true });
    return `@@MATH_DISPLAY_${i}@@`;
  });

  // 2. \[...\]
  src = src.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => {
    const i = mathStore.length;
    mathStore.push({ tex, display: true });
    return `@@MATH_DISPLAY_${i}@@`;
  });

  // 3. $...$ (inline)  — 避免匹配空字串與跨行
  src = src.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
    const i = mathStore.length;
    mathStore.push({ tex, display: false });
    return `@@MATH_INLINE_${i}@@`;
  });

  // 4. \(...\)
  src = src.replace(/\\\((.+?)\\\)/gs, (_, tex) => {
    const i = mathStore.length;
    mathStore.push({ tex, display: false });
    return `@@MATH_INLINE_${i}@@`;
  });

  return src;
}

function restoreMath(html) {
  // display math 佔位符可能被 <p> 包住，直接替換節點內容即可
  html = html.replace(/@@MATH_DISPLAY_(\d+)@@/g, (_, i) => {
    const { tex } = mathStore[i];
    // 用 \[...\] 讓 MathJax 識別為 display mode
    return `\\[${tex}\\]`;
  });

  html = html.replace(/@@MATH_INLINE_(\d+)@@/g, (_, i) => {
    const { tex } = mathStore[i];
    return `\\(${tex}\\)`;
  });

  return html;
}

function openHandleDb() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  if (handleDbPromise) return handleDbPromise;
  handleDbPromise = new Promise(resolve => {
    const request = indexedDB.open(HANDLE_DB_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE_NAME)) {
        db.createObjectStore(HANDLE_STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => {
      console.warn('IndexedDB 開啟失敗，file handle 將不會持久化', request.error);
      resolve(null);
    };
  });
  return handleDbPromise;
}
async function setPersistedHandle(fileId, handle) {
  const db = await openHandleDb();
  if (!db || !fileId) return;
  await new Promise(resolve => {
    const tx = db.transaction(HANDLE_STORE_NAME, 'readwrite');
    tx.objectStore(HANDLE_STORE_NAME).put(handle, fileId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => {
      console.warn('儲存 file handle 失敗', tx.error);
      resolve();
    };
  });
}
async function getPersistedHandle(fileId) {
  const db = await openHandleDb();
  if (!db || !fileId) return null;
  return await new Promise(resolve => {
    const tx = db.transaction(HANDLE_STORE_NAME, 'readonly');
    const request = tx.objectStore(HANDLE_STORE_NAME).get(fileId);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => {
      console.warn('讀取 file handle 失敗', request.error);
      resolve(null);
    };
  });
}
async function removePersistedHandle(fileId) {
  const db = await openHandleDb();
  if (!db || !fileId) return;
  await new Promise(resolve => {
    const tx = db.transaction(HANDLE_STORE_NAME, 'readwrite');
    tx.objectStore(HANDLE_STORE_NAME).delete(fileId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => {
      console.warn('刪除 file handle 失敗', tx.error);
      resolve();
    };
  });
}
async function clearPersistedHandles() {
  const db = await openHandleDb();
  if (!db) return;
  await new Promise(resolve => {
    const tx = db.transaction(HANDLE_STORE_NAME, 'readwrite');
    tx.objectStore(HANDLE_STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => {
      console.warn('清空 file handle 失敗', tx.error);
      resolve();
    };
  });
}
async function hydratePersistedHandles() {
  await Promise.all(Object.keys(files).map(async id => {
    const handle = await getPersistedHandle(id);
    if (!handle) return;
    files[id].handle = handle;
  }));
}
function persistHandleForFile(id) {
  const file = files[id];
  if (!file?.handle) return;
  setPersistedHandle(id, file.handle);
}

// ── marked ───────────────────────────────────────────
marked.setOptions({ gfm: true, breaks: true });

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {

};

// ── State ────────────────────────────────────────────
const files = {};
let activeId = null, unsaved = false, renderTimer = null, idCounter = 0;

const shareModalDismissEl = document.getElementById('share-modal-dismiss');
const shareModalMessageEl = document.getElementById('share-modal-message');

const shareLinkWrapEl = document.getElementById('share-link-wrap');

let fileWatchTimer = null;
let fileWatchBusy = false;

const BOOKMARK_SHARE_FORMAT_VERSION = 1;
const BOOKMARK_SHARE_FLAG_COMPRESSED = 1;
const BOOKMARK_SHARE_URL_LIMIT = 350000;
const bookmarkEncoder = new TextEncoder();
const bookmarkDecoder = new TextDecoder();

// ── Scroll Sync ──────────────────────────────────────
let isSyncingEditorScroll = false;
let isSyncingPreviewScroll = false;

editorEl.addEventListener('scroll', () => {
  if (workspace.className !== '' || window.innerWidth <= 700) return; // 僅在桌面分割模式同步
  if (isSyncingEditorScroll) {
    isSyncingEditorScroll = false;
    return;
  }

  const maxEditorScroll = editorEl.scrollHeight - editorEl.clientHeight;
  if (maxEditorScroll > 0) {
    const scrollPercentage = editorEl.scrollTop / maxEditorScroll;
    previewPane.scrollTop = scrollPercentage * (previewPane.scrollHeight - previewPane.clientHeight);
  }
});

previewPane.addEventListener('scroll', () => {
  if (workspace.className !== '' || window.innerWidth <= 700) return; // 僅在桌面分割模式同步
  if (isSyncingPreviewScroll) {
    isSyncingPreviewScroll = false;
    return;
  }
  isSyncingEditorScroll = true;
  const maxPreviewScroll = previewPane.scrollHeight - previewPane.clientHeight;
  if (maxPreviewScroll > 0) {
    const scrollPercentage = previewPane.scrollTop / maxPreviewScroll;
    editorEl.scrollTop = scrollPercentage * (editorEl.scrollHeight - editorEl.clientHeight);
  }
});

// ── Sidebar ──────────────────────────────────────────

// ── View tabs ─────────────────────────────────────────
const tabEls = {

  split:   document.getElementById('tab-split'),
  preview: document.getElementById('tab-preview')
};

}

tabEls.split.addEventListener('click',   () => setView('split'));

// 視窗大小改變時，如果在手機模式卻是 split，強制轉為 edit

// ── Bookmark share ───────────────────────────────────
function bytesToBase64(bytes) {
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
  }

  if (typeof btoa === 'function') {
    return btoa(binary);
  }

  return Buffer.from(binary, 'binary').toString('base64');
}

function base64ToBytes(input) {
  let binary;
  if (typeof atob === 'function') {
    binary = atob(input);
  } else {
    binary = Buffer.from(input, 'base64').toString('binary');
  }

  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

function base64UrlEncode(bytes) {
  return bytesToBase64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

function base64UrlDecode(input) {
  let base64 = input.replace(/-/g, '+').replace(/_/g, '/');
  while (base64.length % 4 !== 0) {
    base64 += '=';
  }
  return base64ToBytes(base64);
}

function supportsGzipCompression() {
  return typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
}

async function gzipCompress(input) {
  const stream = new Blob([input]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function gzipDecompress(input) {
  const stream = new Blob([input]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function digestHex(input) {
  const hash = await crypto.subtle.digest('SHA-256', bookmarkEncoder.encode(input));
  return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
}

function formatShareTitle(title) {
  const trimmedTitle = title.trim() || 'Untitled';
  const prefix = 'MD Editor · ';
  const maxTitleLength = 60;

  if (trimmedTitle.length <= maxTitleLength) {
    return `${prefix}${trimmedTitle}`;
  }

  return `${prefix}${Array.from(trimmedTitle).slice(0, maxTitleLength - 1).join('')}…`;
}

function updateDocumentTitle() {
  const currentName = (docTitleEl.textContent || 'Untitled').trim() || 'Untitled';
  document.title = `MDeditor: ${currentName}`;
}

function renameActiveFile() {
  if (!activeId || !files[activeId]) return;
  const currentFile = files[activeId];
  const nextName = prompt('Rename file', currentFile.name);
  if (nextName === null) return;
  const trimmedName = nextName.trim();
  if (!trimmedName) return;
  currentFile.name = trimmedName;
  docTitleEl.textContent = trimmedName;
  updateDocumentTitle();
  buildFileList();
  persist();
}

function syncActiveFileContent() {
  if (activeId && files[activeId]) {
    files[activeId].content = editorEl.value;
  }
}

function getShareableWorkspaceState() {
  syncActiveFileContent();
  const fileIds = Object.keys(files);
  const activeIndex = activeId ? fileIds.indexOf(activeId) : -1;

  return {
    version: 1,
    title: docTitleEl.textContent || 'Untitled',
    theme: themeSelect.value,
    fontSize: fontSizeSelect.value,
    view: workspace.className === 'editor-only' ? 'edit' : workspace.className === 'preview-only' ? 'preview' : 'split',
    activeIndex,
    files: fileIds.map(id => ({
      name: files[id].name,
      content: files[id].content
    }))
  };
}

async function createBookmarkShareFragment() {
  const body = getShareableWorkspaceState();
  const checksum = await digestHex(JSON.stringify(body));
  const packet = JSON.stringify({ ...body, checksum });
  const rawBytes = bookmarkEncoder.encode(packet);
  const compressedBytes = supportsGzipCompression() ? await gzipCompress(rawBytes) : null;
  const useCompressed = Boolean(compressedBytes && compressedBytes.length < rawBytes.length);
  const payloadBytes = useCompressed ? compressedBytes : rawBytes;
  const packetBytes = new Uint8Array(payloadBytes.length + 2);
  packetBytes[0] = BOOKMARK_SHARE_FORMAT_VERSION;
  packetBytes[1] = useCompressed ? BOOKMARK_SHARE_FLAG_COMPRESSED : 0;
  packetBytes.set(payloadBytes, 2);

  return base64UrlEncode(packetBytes);
}

async function createBookmarkShareUrl() {
  const fragment = await createBookmarkShareFragment();
  const url = new URL(window.location.href);
  url.search = '';
  url.hash = fragment;

  if (url.toString().length > BOOKMARK_SHARE_URL_LIMIT) {
    throw new Error('Share link is too large.');
  }

  return { url: url.toString(), title: formatShareTitle(docTitleEl.textContent || 'Untitled') };
}

async function decodeBookmarkShareFragment(fragment) {
  const rawFragment = fragment.startsWith('#') ? fragment.slice(1) : fragment;
  if (!rawFragment) {
    throw new Error('Invalid bookmark share link.');
  }

  const packetBytes = base64UrlDecode(rawFragment);
  if (packetBytes.length < 2) {
    throw new Error('Invalid bookmark share link.');
  }

  const formatVersion = packetBytes[0];
  const flags = packetBytes[1];
  if (formatVersion !== BOOKMARK_SHARE_FORMAT_VERSION) {
    throw new Error('Unsupported bookmark share link.');
  }

  const payloadBytes = packetBytes.slice(2);
  const rawBytes = flags & BOOKMARK_SHARE_FLAG_COMPRESSED
    ? await gzipDecompress(payloadBytes)
    : payloadBytes;

  const body = JSON.parse(bookmarkDecoder.decode(rawBytes));
  const { checksum, ...withoutChecksum } = body;
  const expectedChecksum = await digestHex(JSON.stringify(withoutChecksum));

  if (checksum !== expectedChecksum) {
    throw new Error('Bookmark share link checksum mismatch.');
  }

  return body;
}

function hasFileDragData(event) {
  const types = event.dataTransfer?.types;
  if (!types) return false;
  if (typeof types.contains === 'function') return types.contains('Files');
  return Array.from(types).includes('Files');
}

async function createRawFileShareUrl(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const fragment = base64UrlEncode(bytes);
  const url = new URL(window.location.href);
  url.search = '';
  url.hash = fragment;

  if (url.toString().length > BOOKMARK_SHARE_URL_LIMIT) {
    throw new Error('Dropped file is too large.');
  }

  return url.toString();
}

async function handleShareModalFileDrop(fileObjects) {
  const file = fileObjects?.[0];
  if (!file) return;

  try {
    const url = await createRawFileShareUrl(file);
    history.replaceState(null, '', url);
    setShareModalMessage(`Bookmark-only link updated from ${file.name || 'the dropped file'}.`);
  } catch (error) {
    console.error('Error generating raw file share link:', error);
    setShareModalMessage('Failed to update the address bar from the dropped file.', true);
  }
}

async function handleGetSharableLink() {
  try {
    const share = await createBookmarkShareUrl();
    if (window.location.href !== share.url) {
      history.pushState(null, '', share.url);
    }
    showShareSuccess(share.url);
  } catch (error) {
    console.log('Error generating bookmark share link:', error);
    showShareFailure('Failed to generate bookmark-only link.');
  }
}

async function loadBookmarkShareFromLocation() {
  if (!window.location.hash) {
    return false;
  }

  const payload = await decodeBookmarkShareFragment(window.location.hash);
  clearHistory();

  const filesPayload = Array.isArray(payload.files) ? payload.files : [];
  const createdIds = [];

  filesPayload.forEach(file => {
    const id = 'f' + (++idCounter);
    files[id] = {
      name: file?.name || 'Untitled.md',
      content: file?.content || '',
      handle: null,
      sourceKey: null,
      lastModified: null,
      size: null,
      externallyModified: false
    };
    createdIds.push(id);
  });

  buildFileList();

  if (createdIds.length) {
    const activeIndex = Number.isInteger(payload.activeIndex) ? payload.activeIndex : -1;
    const targetId = createdIds[activeIndex >= 0 && activeIndex < createdIds.length ? activeIndex : 0];
    activateFile(targetId);
  } else {
    editorEl.value = '';
    previewEl.innerHTML = '<div class="empty-preview"><div class="empty-icon">✍️</div><span>Start typing to preview live</span></div>';
    docTitleEl.textContent = 'Untitled';
    updateDocumentTitle();
    wcEl.style.display = 'none';
    updateReloadNotice();
  }

  if (payload.theme) {
    setTheme(payload.theme);
  }
  if (payload.fontSize) {
    applyFontScale(payload.fontSize);
  }
  if (payload.view) {
    setView(payload.view);
  }

  unsaved = false;
  udot.classList.remove('show');
  persist();
  return true;
}

function newFile(name = 'Untitled', content = '', handle = null) {
  const id = 'f' + (++idCounter);
  files[id] = {
    name,
    content,
    handle,
    sourceKey: null,
    lastModified: null,
    size: null,
    externallyModified: false
  };
  buildFileList();
  activateFile(id);
  return id;
}
function buildSourceKey(fileLike) {
  if (!fileLike) return null;
  const name = fileLike.name || 'unknown';
  const size = fileLike.size ?? '';
  const lastModified = fileLike.lastModified ?? '';
  return `${name}::${size}::${lastModified}`;
}
async function findExistingFileIdByHandle(handle) {
  if (!handle?.isSameEntry) return null;
  for (const [id, fileEntry] of Object.entries(files)) {
    if (!fileEntry.handle?.isSameEntry) continue;
    try {
      if (await fileEntry.handle.isSameEntry(handle)) return id;
    } catch {}
  }
  return null;
}
function findExistingFileIdBySourceKey(sourceKey) {
  if (!sourceKey) return null;
  return Object.keys(files).find(id => files[id].sourceKey === sourceKey) || null;
}
function upsertExistingFile(id, { name, content, handle = files[id].handle || null, fileSnapshot = null }) {
  const target = files[id];
  if (!target) return null;
  target.name = name;
  target.content = content;
  target.handle = handle;
  target.sourceKey = buildSourceKey(fileSnapshot || { name, lastModified: target.lastModified, size: target.size });
  if (fileSnapshot) updateFileSnapshot(target, fileSnapshot);
  if (target.handle) persistHandleForFile(id);
  buildFileList();
  activateFile(id);
  return id;
}
async function openOrActivateFile({ name, content, handle = null, fileSnapshot = null }) {
  const existingId = handle
    ? await findExistingFileIdByHandle(handle)
    : findExistingFileIdBySourceKey(buildSourceKey(fileSnapshot || { name }));
  if (existingId) {
    return upsertExistingFile(existingId, { name, content, handle, fileSnapshot });
  }
  const id = newFile(name, content, handle);
  const target = files[id];
  target.sourceKey = buildSourceKey(fileSnapshot || { name });
  if (fileSnapshot) updateFileSnapshot(target, fileSnapshot);
  if (target.handle) persistHandleForFile(id);
  return id;
}
async function importFileObjects(fileObjects) {
  for (const file of fileObjects) {
    const content = await file.text();
    await openOrActivateFile({ name: file.name, content, fileSnapshot: file });
  }
}
async function importSharedPayload() {
  const cache = await caches.open('md-editor-v3');
  const response = await cache.match(SHARED_DATA_URL);
  if (!response) return false;

  const payload = await response.json();
  await cache.delete(SHARED_DATA_URL);

  if (Array.isArray(payload.files) && payload.files.length) {
    for (const file of payload.files) {
      await openOrActivateFile({ name: file.name || 'shared.md', content: file.text || '' });
    }
    return true;
  }

  const parts = [payload.title, payload.text, payload.url].filter(Boolean);
  if (parts.length) {
    await openOrActivateFile({ name: 'shared.md', content: parts.join('\n\n') });
    return true;
  }

  return false;
}
async function importFileHandles(handles) {
  for (const handle of handles) {
    if (!handle || handle.kind !== 'file') continue;
    const file = await handle.getFile();
    const content = await file.text();
    await openOrActivateFile({ name: file.name, content, handle, fileSnapshot: file });
  }
}
function updateFileSnapshot(targetFile, sourceFile) {
  if (!targetFile || !sourceFile) return;
  targetFile.lastModified = sourceFile.lastModified ?? null;
  targetFile.size = sourceFile.size ?? null;
  targetFile.externallyModified = false;
}
function updateReloadButtonState() {
  const activeFile = activeId ? files[activeId] : null;
  const canReload = !!activeFile;
  reloadBtnEl.disabled = !canReload;
  reloadBtnEl.title = activeFile
    ? (activeFile.handle ? 'Reload from disk' : 'This file has no disk handle; reopen it with Open to enable reload')
    : 'No file open';
  reloadBtnEl.classList.toggle('dirty', !!activeFile?.externallyModified);
}
function updateReloadNotice() {
  const activeFile = activeId ? files[activeId] : null;
  if (!activeFile?.externallyModified) {
    reloadNoticeEl.classList.remove('show');
    reloadTextEl.textContent = 'File changed';
    updateReloadButtonState();
    return;
  }
  reloadTextEl.textContent = unsaved ? 'File changed on disk. Reload will replace unsaved edits.' : 'File changed on disk';
  reloadNoticeEl.classList.add('show');
  updateReloadButtonState();
}
async function reloadActiveFile() {
  if (!activeId) return;
  const currentFile = files[activeId];
  if (!currentFile?.handle) {
    alert('This file does not have a disk handle, so it cannot be reloaded. Open it with the Open button to enable reload.');
    return;
  }
  if (unsaved && !confirm('Reload will replace unsaved edits. Continue?')) return;
  try {
    const diskFile = await currentFile.handle.getFile();
    currentFile.content = await diskFile.text();
    currentFile.name = diskFile.name || currentFile.name;
    updateFileSnapshot(currentFile, diskFile);
    editorEl.value = currentFile.content;
    docTitleEl.textContent = currentFile.name;
    unsaved = false;
    udot.classList.remove('show');
    buildFileList();
    renderPreview();
    updateWC();
    updateReloadNotice();
  } catch (err) {
    console.error('reload 檔案失敗', err);
  }
}
async function checkExternalFileChanges() {
  if (fileWatchBusy || document.hidden) return;
  const watchedFiles = Object.values(files).filter(file => file.handle);
  if (!watchedFiles.length) return;
  fileWatchBusy = true;
  try {
    for (const fileEntry of watchedFiles) {
      try {
        const diskFile = await fileEntry.handle.getFile();
        if (fileEntry.lastModified === null && fileEntry.size === null) {
          updateFileSnapshot(fileEntry, diskFile);
          continue;
        }
        const changed = diskFile.lastModified !== fileEntry.lastModified || diskFile.size !== fileEntry.size;
        if (changed) fileEntry.externallyModified = true;
      } catch (err) {
        console.warn('檔案變更偵測失敗', err);
      }
    }
  } finally {
    fileWatchBusy = false;
    updateReloadNotice();
  }
}
function startFileWatcher() {
  if (fileWatchTimer) clearInterval(fileWatchTimer);
  fileWatchTimer = setInterval(checkExternalFileChanges, FILE_WATCH_INTERVAL_MS);
}
function buildFileList() {
  fileListEl.innerHTML = '';
  const keys = Object.keys(files);
  if (!keys.length) {
    fileListEl.innerHTML = '<div style="padding:14px 12px;font-size:12px;color:var(--text-muted)">No files open</div>';
    return;
  }
  keys.forEach(id => {
    const f = files[id];
    const el = document.createElement('div');
    el.className = 'file-item' + (id === activeId ? ' active' : '');
    el.innerHTML = `<span style="font-size:12px;opacity:.5">📄</span><span class="fname">${esc(f.name)}</span><button class="del-btn">✕</button>`;
    el.title = f.name;
    el.querySelector('.fname').title = f.name;
    el.querySelector('.fname').addEventListener('click', () => activateFile(id));
    el.querySelector('.del-btn').addEventListener('click', e => { e.stopPropagation(); deleteFile(id); });
    fileListEl.appendChild(el);
  });
}
function activateFile(id) {
  if (activeId && files[activeId]) files[activeId].content = editorEl.value;
  activeId = id;
  editorEl.value = files[id].content;
  docTitleEl.textContent = files[id].name;
  updateDocumentTitle();
  unsaved = false; udot.classList.remove('show');
  buildFileList();
  renderPreview();
  updateWC();
  updateReloadNotice();
  editorEl.focus();
  if (window.innerWidth <= 700) closeSidebar();
}
function deleteFile(id) {
  removePersistedHandle(id);
  delete files[id];
  if (activeId === id) {
    activeId = null; editorEl.value = '';
    previewEl.innerHTML = '<div class="empty-preview"><div class="empty-icon">✍️</div><span>Start typing to preview live</span></div>';
    docTitleEl.textContent = 'Untitled'; wcEl.style.display = 'none';
    updateDocumentTitle();
    updateReloadNotice();
  }
  buildFileList();
  const keys = Object.keys(files);
  if (keys.length) activateFile(keys[keys.length - 1]);
}
function clearHistory() {
  Object.keys(files).forEach(id => delete files[id]);
  activeId = null;
  editorEl.value = '';
  previewEl.innerHTML = '<div class="empty-preview"><div class="empty-icon">✍️</div><span>Start typing to preview live</span></div>';
  docTitleEl.textContent = 'Untitled';
  updateDocumentTitle();
  wcEl.style.display = 'none';
  unsaved = false;
  udot.classList.remove('show');
  updateReloadNotice();
  buildFileList();
  try { sessionStorage.removeItem(WORKSPACE_STATE_KEY); } catch {}
  try { localStorage.removeItem(WORKSPACE_MIGRATION_KEY); } catch {}
  clearPersistedHandles();
}

document.querySelectorAll('.tb-btn[data-action]').forEach(btn => {

      case 'italic':       wrap('_', '_'); break;
      case 'strike':       wrap('~~', '~~'); break;
      case 'h1':           prependLine('# '); break;
      case 'h2':           prependLine('## '); break;
      case 'h3':           prependLine('### '); break;
      case 'ul':           prependLine('- '); break;
      case 'ol':           prependLine('1. '); break;
      case 'task':         prependLine('- [ ] '); break;
      case 'quote':        prependLine('> '); break;
      case 'code':         wrap('`', '`'); break;
      case 'codeblock':    insertAt('```\n' + (sel || 'code') + '\n```'); break;
      case 'link':         insertAt(`[${sel || '連結文字'}](url)`); break;
      case 'image':        insertAt(`![${sel || '圖片說明'}](url)`); break;
      case 'table':        insertAt('\n| 欄位1 | 欄位2 | 欄位3 |\n|-------|-------|-------|\n| 內容 | 內容 | 內容 |\n'); break;
      case 'hr':           insertAt('\n---\n'); break;
      // 數學式插入
      case 'math-inline':  wrap('$', '$'); break;
      case 'math-block':   insertAt('\n$$\n' + (sel || 'E = mc^2') + '\n$$\n'); break;
    }
    renderPreview();
  });
});

// ── Render ────────────────────────────────────────────
function renderPreview() {
  const md = editorEl.value;
  if (!md.trim()) {
    previewEl.className = '';
    previewEl.innerHTML = '<div class="empty-preview"><div class="empty-icon">✍️</div><span>Start typing to preview live</span></div>';
    return;
  }

  // 1. 先保護數學式，避免被 marked 誤處理
  const protectedMd = escapeMath(md);

  // 2. 用 marked 轉換 Markdown → HTML
  let html = marked.parse(protectedMd);

  // 3. sanitize
  html = sanitizeHtml(html);

  // 4. 還原數學式佔位符為 MathJax 語法
  html = restoreMath(html);

  // 5. 注入 HTML
  previewEl.className = 'md';
  previewEl.innerHTML = html;

  // 6. 呼叫 MathJax 重新排版預覽區域
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([previewEl]).catch(err => console.warn('MathJax error:', err));
  }
}

function updateWC() {
  const plain = editorEl.value
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`[^`]*`/g, '')
    .replace(/[#*_\[\]>!]/g, '');
  const wc = (plain.match(/[\u4e00-\u9fff\u3040-\u30ff]/g) || []).length
           + (plain.match(/\b\w+\b/g) || []).length;
  wcEl.textContent = wc + ' 字';
  wcEl.style.display = wc ? 'inline' : 'none';
}

// ── Editor helpers ────────────────────────────────────
function wrap(before, after) {
  const s = editorEl.selectionStart, e = editorEl.selectionEnd;
  const sel = editorEl.value.substring(s, e) || '文字';
  editorEl.setRangeText(before + sel + after, s, e, 'select');
  editorEl.selectionStart = s + before.length;
  editorEl.selectionEnd   = s + before.length + sel.length;
  editorEl.dispatchEvent(new Event('input'));
}
function prependLine(prefix) {
  const s = editorEl.selectionStart;
  const ls = editorEl.value.lastIndexOf('\n', s - 1) + 1;
  editorEl.setRangeText(prefix, ls, ls, 'end');
  editorEl.dispatchEvent(new Event('input'));
}
function insertAt(text) {
  const s = editorEl.selectionStart, e = editorEl.selectionEnd;
  editorEl.setRangeText(text, s, e, 'end');
  editorEl.dispatchEvent(new Event('input'));
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function sanitizeHtml(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const allowedTags = new Set([
    'a', 'blockquote', 'br', 'button', 'code', 'del', 'div', 'em', 'h1', 'h2', 'h3',
    'h4', 'h5', 'h6', 'hr', 'img', 'input', 'li', 'ol', 'p', 'pre', 'span', 'strong',
    'table', 'tbody', 'td', 'thead', 'th', 'tr', 'ul'
  ]);
  const globalAttrs = new Set(['class', 'title', 'aria-label']);
  const allowedAttrs = {
    a:      new Set(['href', 'target', 'rel']),
    button: new Set(['type']),
    code:   new Set(['class']),
    img:    new Set(['src', 'alt']),
    input:  new Set(['type', 'checked', 'disabled'])
  };
  const safeUrl = value =>
    /^(https?:|mailto:|tel:|data:image\/)/i.test(value) ||
    /^(\/|\.\/|\.\.\/|#)/.test(value);

  doc.body.querySelectorAll('*').forEach(node => {
    const tag = node.tagName.toLowerCase();
    if (!allowedTags.has(tag)) {
      node.replaceWith(...node.childNodes);
      return;
    }
    [...node.attributes].forEach(attr => {
      const name  = attr.name.toLowerCase();
      const value = attr.value.trim();
      const tagAttrs = allowedAttrs[tag] || new Set();
      const allowed  = globalAttrs.has(name) || tagAttrs.has(name);
      const isEvent  = name.startsWith('on');
      if (isEvent || !allowed) { node.removeAttribute(attr.name); return; }
      if ((name === 'href' || name === 'src') && !safeUrl(value)) node.removeAttribute(attr.name);
    });
    if (tag === 'a' && node.hasAttribute('href')) {
      node.setAttribute('target', '_blank');
      node.setAttribute('rel', 'noopener noreferrer');
    }
    if (tag === 'input') {
      if (node.getAttribute('type') !== 'checkbox') node.remove();
      else node.setAttribute('disabled', '');
    }
  });
  return doc.body.innerHTML;
}

// ── Copy code ─────────────────────────────────────────
function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ 已複製'; btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = '⎘ 複製'; btn.classList.remove('copied'); }, 2000);
  });
}
previewEl.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (btn) copyCode(btn);
});

// ── Drag & drop ───────────────────────────────────────
function isSupportedTextFile(file) {
  return /\.(md|markdown|txt)$/i.test(file.name);
}
function showDropOverlay() {
  dropOverlayEl.classList.add('show');
}
function hideDropOverlay() {
  dropOverlayEl.classList.remove('show');
}
document.body.addEventListener('dragenter', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  dragDepth += 1;
  showDropOverlay();
});
document.body.addEventListener('dragover', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
document.body.addEventListener('dragleave', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) hideDropOverlay();
});
document.body.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  hideDropOverlay();
  const droppedFiles = Array.from(e.dataTransfer.files).filter(isSupportedTextFile);
  importFileObjects(droppedFiles);
});

// ── LocalStorage auto-save ────────────────────────────
function persist() {
  if (activeId && files[activeId]) files[activeId].content = editorEl.value;
  const serializableFiles = Object.fromEntries(
    Object.entries(files).map(([id, file]) => [id, {
      name: file.name,
      content: file.content,
      sourceKey: file.sourceKey || null
    }])
  );
  try {
    sessionStorage.setItem(WORKSPACE_STATE_KEY, JSON.stringify({ files: serializableFiles, activeId, idCounter }));
  } catch {}
}
async function restore() {
  try {
    const rawState = sessionStorage.getItem(WORKSPACE_STATE_KEY) || localStorage.getItem(WORKSPACE_MIGRATION_KEY);
    const d = JSON.parse(rawState || 'null');
    if (!d) return false;
    Object.entries(d.files || {}).forEach(([id, file]) => {
      files[id] = {
        name: file.name,
        content: file.content,
        handle: null,
        sourceKey: file.sourceKey || null,
        lastModified: null,
        size: null,
        externallyModified: false
      };
    });
    await hydratePersistedHandles();
    idCounter = d.idCounter || 0;
    buildFileList();
    if (sessionStorage.getItem(WORKSPACE_STATE_KEY) === null) {
      sessionStorage.setItem(WORKSPACE_STATE_KEY, JSON.stringify(d));
    }
    if (d.activeId && files[d.activeId]) { activateFile(d.activeId); return true; }
  } catch {}
  return false;
}
setInterval(persist, 3000);
window.addEventListener('beforeunload', persist);

// ── Font size ─────────────────────────────────────────
const FONT_SCALE_PRESETS = new Set(['0.9', '1', '1.15', '1.3']);
function px(value) {
  return `${Math.round(value * 10) / 10}px`;
}
function applyFontScale(scaleValue) {
  const normalized = FONT_SCALE_PRESETS.has(String(scaleValue)) ? Number(scaleValue) : 1;
  document.documentElement.style.setProperty('--editor-font-size', px(13.5 * normalized));
  document.documentElement.style.setProperty('--preview-font-size', px(15 * normalized));
  document.documentElement.style.setProperty('--preview-list-font-size', px(15 * normalized));
  document.documentElement.style.setProperty('--preview-code-font-size', px(13 * normalized));
  document.documentElement.style.setProperty('--preview-table-font-size', px(14 * normalized));
  document.documentElement.style.setProperty('--preview-th-font-size', px(12.5 * normalized));
  fontSizeSelect.value = String(normalized);
  localStorage.setItem('md-font-scale', String(normalized));
}
fontSizeSelect.addEventListener('change', e => applyFontScale(e.target.value));
applyFontScale(localStorage.getItem('md-font-scale') || '1');

// ── Theme ─────────────────────────────────────────────
const themeSelect = document.getElementById('theme-select');
function setTheme(theme) {
  document.body.classList.remove('theme-light', 'theme-eink');
  if (theme === 'light') document.body.classList.add('theme-light');
  else if (theme === 'eink') document.body.classList.add('theme-eink');
  themeSelect.value = theme;
  localStorage.setItem('md-theme', theme);
}
themeSelect.addEventListener('change', e => setTheme(e.target.value));
setTheme(localStorage.getItem('md-theme') || 'dark');
docTitleEl.addEventListener('click', renameActiveFile);
updateDocumentTitle();

  } catch (err) {

  }

  if (!await restore()) {
    newFile('Welcome.md', `# Welcome to MD Editor

  }

  if (location.search.includes('share-target=1') && 'caches' in window) {
    importSharedPayload().then(imported => {

  }
}

// ── PWA file launch ───────────────────────────────────
const initPromise = initApp().catch(err => {
  console.error('初始化失敗', err);
});
if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
  launchQueue.setConsumer(async launchParams => {
    if (!launchParams.files || !launchParams.files.length) return;
    await initPromise;
    await importFileHandles(launchParams.files);
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
startFileWatcher();
</script>
